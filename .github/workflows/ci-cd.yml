name: Ansible CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install ansible ansible-lint

      - name: Lint Ansible files
        run: |
          ansible-lint config.yml check_ap.yml playbook.yml

      - name: Ansible Syntax Check
        run: |
          ansible-playbook config.yml --syntax-check \
          -e "ansible_network_os=cisco.ios.ios"
